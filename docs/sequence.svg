<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrSlate" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700" letter-spacing="0.5">udpmux — Session Lifecycle</text>
  <text x="430" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Handshake · session creation · steady-state data · reset</text>

  <!-- ═══════ Participant headers ═══════════════════════════════════ -->
  <!-- x positions: Client=100, Proxy=280, Mux=500, Backend=700 -->

  <rect x="42"  y="66" width="116" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="100" y="89" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Client</text>

  <rect x="222" y="66" width="116" height="36" rx="6" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="89" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">udp-proxy</text>

  <rect x="442" y="66" width="116" height="36" rx="6" fill="#0d6860" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="500" y="89" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">udp-mux</text>

  <rect x="642" y="66" width="116" height="36" rx="6" fill="#92400e" stroke="#d97706" stroke-width="1.5"/>
  <text x="700" y="89" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Backend</text>

  <!-- Lifelines -->
  <line x1="100" y1="102" x2="100" y2="570" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="280" y1="102" x2="280" y2="570" stroke="#1e40af" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="500" y1="102" x2="500" y2="570" stroke="#0d6860" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="700" y1="102" x2="700" y2="570" stroke="#92400e" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SECTION 1: Handshake                                           -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="18" y="115" width="824" height="18" rx="4" fill="#1e293b"/>
  <text x="430" y="128" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.8">HANDSHAKE  (first packet from this client)</text>

  <!-- 1. Client → Proxy: plain UDP (first packet) -->
  <line x1="104" y1="152" x2="272" y2="152" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="190" y="146" text-anchor="middle" fill="#60a5fa" font-size="10">plain UDP pkt</text>

  <!-- 2. Proxy: buffer packet, transition IDLE→HANDSHAKING -->
  <rect x="268" y="158" width="24" height="22" rx="3" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1"/>
  <text x="280" y="173" text-anchor="middle" fill="#93c5fd" font-size="8">BUF</text>

  <!-- 3. Proxy → Mux: PROXY_HELLO (up to 5 retries) -->
  <line x1="284" y1="168" x2="492" y2="168" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrBlue)" stroke-dasharray="5,2"/>
  <text x="388" y="162" text-anchor="middle" fill="#60a5fa" font-size="10">PROXY_HELLO [endpoint]</text>

  <!-- retry indicator -->
  <text x="388" y="185" text-anchor="middle" fill="#475569" font-size="9">↺ up to 5×, 500 ms apart</text>

  <!-- 4. Mux: dial backend -->
  <rect x="488" y="192" width="24" height="22" rx="3" fill="#0f766e" stroke="#14b8a6" stroke-width="1"/>
  <text x="500" y="207" text-anchor="middle" fill="#5eead4" font-size="8">DIAL</text>

  <!-- 5. Mux → Backend: (implicit — UDP socket opened) -->
  <line x1="516" y1="202" x2="692" y2="202" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrSlate)" stroke-dasharray="3,3"/>
  <text x="604" y="196" text-anchor="middle" fill="#64748b" font-size="9">dial UDP socket</text>

  <!-- 6. Mux → Proxy: MUX_HELLO -->
  <line x1="496" y1="220" x2="288" y2="220" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="392" y="214" text-anchor="middle" fill="#34d399" font-size="10">MUX_HELLO</text>

  <!-- 7. Proxy: flush buffer, transition HANDSHAKING→ESTABLISHED -->
  <rect x="268" y="226" width="24" height="22" rx="3" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1"/>
  <text x="280" y="241" text-anchor="middle" fill="#93c5fd" font-size="8">FLS</text>
  <text x="306" y="241" fill="#475569" font-size="9">flush buffer → ESTABLISHED</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SECTION 2: Steady-state data                                   -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="18" y="265" width="824" height="18" rx="4" fill="#1e293b"/>
  <text x="430" y="278" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.8">STEADY-STATE DATA  (established session)</text>

  <!-- Client → Proxy → Mux → Backend (raw, no header) -->
  <line x1="104" y1="304" x2="272" y2="304" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="190" y="298" text-anchor="middle" fill="#60a5fa" font-size="10">plain UDP pkt</text>

  <line x1="284" y1="304" x2="492" y2="304" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="388" y="298" text-anchor="middle" fill="#60a5fa" font-size="10">raw (zero overhead)</text>

  <line x1="504" y1="304" x2="692" y2="304" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="598" y="298" text-anchor="middle" fill="#34d399" font-size="10">plain UDP pkt</text>

  <!-- Backend → Mux → Proxy → Client (reply) -->
  <line x1="696" y1="330" x2="508" y2="330" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrAmber)"/>
  <text x="602" y="324" text-anchor="middle" fill="#fbbf24" font-size="10">reply pkt</text>

  <line x1="496" y1="330" x2="288" y2="330" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrAmber)"/>
  <text x="392" y="324" text-anchor="middle" fill="#fbbf24" font-size="10">raw (zero overhead)</text>

  <line x1="276" y1="330" x2="108" y2="330" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrAmber)"/>
  <text x="190" y="324" text-anchor="middle" fill="#fbbf24" font-size="10">plain UDP reply</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SECTION 3: RESET / re-handshake                                -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="18" y="360" width="824" height="18" rx="4" fill="#1e293b"/>
  <text x="430" y="373" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.8">RESET  (mux evicted session after inactivity timeout)</text>

  <!-- Client → Proxy: new packet after session expired on mux -->
  <line x1="104" y1="400" x2="272" y2="400" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="190" y="394" text-anchor="middle" fill="#60a5fa" font-size="10">plain UDP pkt</text>

  <!-- Proxy → Mux: raw data (proxy still thinks ESTABLISHED) -->
  <line x1="284" y1="400" x2="492" y2="400" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="388" y="394" text-anchor="middle" fill="#60a5fa" font-size="10">raw data (stale session)</text>

  <!-- Mux → Proxy: RESET (unknown session) -->
  <line x1="496" y1="422" x2="288" y2="422" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrSlate)"/>
  <text x="392" y="416" text-anchor="middle" fill="#f87171" font-size="10">RESET</text>

  <!-- Proxy: re-handshake -->
  <rect x="268" y="428" width="24" height="22" rx="3" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1"/>
  <text x="280" y="443" text-anchor="middle" fill="#93c5fd" font-size="8">RST</text>
  <text x="308" y="443" fill="#475569" font-size="9">IDLE → re-handshake (same as §1)</text>

  <!-- Note: proxy timeout shorter than mux timeout -->
  <text x="430" y="470" text-anchor="middle" fill="#475569" font-size="9">proxy session timeout (default 5 min) &lt; mux session timeout (default 10 min) — proxy always expires first</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Frame format reminder                                          -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="18" y="488" width="824" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="430" y="506" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.5">CONTROL FRAME  (8 bytes)</text>
  <line x1="18" y1="512" x2="842" y2="512" stroke="#334155" stroke-width="1"/>
  <text x="215" y="526" text-anchor="middle" fill="#7dd3fc" font-size="10">Magic 4B  (0x5544504D "UDPM")</text>
  <line x1="430" y1="513" x2="430" y2="528" stroke="#334155" stroke-width="1"/>
  <text x="636" y="526" text-anchor="middle" fill="#86efac" font-size="10">Flags 2B  +  Length 2B  |  data packets: raw, zero overhead</text>

  <!-- legend -->
  <line x1="28"  y1="552" x2="60"  y2="552" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="64"  y="556" fill="#94a3b8" font-size="10">plain UDP / raw data</text>
  <line x1="200" y1="552" x2="232" y2="552" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="236" y="556" fill="#94a3b8" font-size="10">backend traffic</text>
  <line x1="380" y1="552" x2="412" y2="552" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrAmber)"/>
  <text x="416" y="556" fill="#94a3b8" font-size="10">reply traffic</text>
  <line x1="540" y1="552" x2="572" y2="552" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrSlate)"/>
  <text x="576" y="556" fill="#94a3b8" font-size="10">control frame</text>
  <line x1="700" y1="552" x2="732" y2="552" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrSlate)"/>
  <text x="736" y="556" fill="#94a3b8" font-size="10">RESET</text>
</svg>
